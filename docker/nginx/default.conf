# Configuração básica do Nginx para Servir Sites Estáticos
# Este arquivo pode ser colocado em /etc/nginx/sites-available/meusite.conf
# E ativado com um link simbólico para /etc/nginx/sites-enabled/

server {
    # Define a porta em que o servidor vai escutar (80 é o padrão para HTTP)
    listen 80;
    listen [::]:80;

    # Altere para o seu domínio ou IP público. Ex: meu-site.com www.meu-site.com
    server_name localhost;

    # Pasta raiz onde ficam armazenados os arquivos estáticos (HTML, CSS, JS, Imagens)
    root /var/www/html;

    # Arquivos que o Nginx tentará carregar por padrão ao acessar a raiz do site
    index index.html index.htm;

    # Configuração principal para entrega dos arquivos
    location / {
        # Tenta servir a URL como um arquivo direto. Se não existir, tenta como pasta.
        # Se ainda assim não existir, retorna um erro 404.
        try_files $uri $uri/ =404;
    }

    # Otimização: Cache de arquivos de mídia e estáticos pesados (imagens, vídeos, áudio)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Otimização: Cache de arquivos CSS e JavaScript
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Páginas de erro customizadas (opcional)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}